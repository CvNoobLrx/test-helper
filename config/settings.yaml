# Final Review Helper - Configuration
# This is the main configuration file for the review assistant.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "openai"  # Options: openai, azure, ollama, deepseek
  model: "astron-code-latest"
  base_url: "https://maas-coding-api.cn-huabei-1.xf-yun.com/v2"
  deployment_name: "astron-code-latest"
  azure_endpoint: ""
  api_version: ""
  api_key: "c92162bc2f306120571be8777a648c71:NjFjOThkN2FmZmJhZDRjYzIwM2VkMzg0"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  # The Xunfei Coding API configured above supports chat/vision only, not embeddings.
  # Use ONNX Runtime for compact cross-platform deployment.
  # For higher quality later, switch model to "BAAI/bge-m3" and dimensions to 1024.
  provider: "onnx"  # Options: openai, azure, ollama, onnx
  model: "intfloat/multilingual-e5-small"
  dimensions: 384
  base_url: ""
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: ""
  deployment_name: "astron-code-latest"
  api_version: ""
  api_key: "c92162bc2f306120571be8777a648c71:NjFjOThkN2FmZmJhZDRjYzIwM2VkMzg0"
  # API keys should be provided through environment variables.

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true  # Set to true to enable vision capabilities
  provider: "openai"  # Options: openai, azure, ollama
  model: "astron-code-latest"  # Options: gpt-4o, gpt-4-vision-preview (OpenAI), llava (Ollama)
  base_url: "https://maas-coding-api.cn-huabei-1.xf-yun.com/v2"
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: ""
  deployment_name: "astron-code-latest"
  api_version: ""
  api_key: "c92162bc2f306120571be8777a648c71:NjFjOThkN2FmZmJhZDRjYzIwM2VkMzg0"
  # Ollama-specific settings (if provider is ollama):
  # base_url: "http://localhost:11434"
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# OCR Configuration (optional PDF fallback)
# =============================================================================
ocr:
  mode: "auto"  # Options: off, auto, always
  provider: "rapidocr"  # Lightweight ONNXRuntime OCR backend
  dpi: 180
  min_text_chars_per_page: 30
  max_pages: null

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: true
  provider: "llm"  # Options: none, llm
  model: "none"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment

  # Knowledge Point Extraction Configuration
  knowledge_point_extractor:
    use_llm: true  # Set to true to enable LLM-based knowledge point extraction

# =============================================================================
# Mastery Tracking Configuration (Spaced Repetition)
# =============================================================================
mastery:
  enabled: true
  data_dir: "data/db/mastery"
  default_interval_days: 1
  min_ease_factor: 1.3
